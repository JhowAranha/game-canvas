<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>

  <style>
    #canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid black;
      width: 40rem;
      margin: auto;
    }

    .d-btn {
      width: 10rem;
      height: 10rem;
    }

    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: max-content;
      height: max-content;
      margin-inline: auto;
      margin-top: 5rem;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-wrap: wrap;">
    <canvas id="canvas" width="10" height="10"></canvas>

    <div class="d-pad">
      <button id="up" class="d-btn" style="grid-row: 1; grid-column: 2;"></button>
      <button id="left" class="d-btn" style="grid-row: 2; grid-column: 1;"></button>
      <button id="view-lines" class="d-btn" style="grid-row: 2; grid-column: 2;"></button>
      <button id="right" class="d-btn" style="grid-row: 2; grid-column: 3;"></button>
      <button id="down" class="d-btn" style="grid-row: 3; grid-column: 2;"></button>
    </div>
  </div>
  
  <script type="module" src="./scripts.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</body>
</html>
